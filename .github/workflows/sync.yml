name: Sync Upstream

on:
  schedule:
    # 每天 UTC 0 点（北京时间早 8 点）自动执行一次
    - cron: '0 0 * * *'
  # 允许在 Actions 页面手动点击按钮立即触发一次测试
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          # 需要同步的分支，根据实际情况修改（一般为 main 或 master）
          ref: main
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_sync_branch: main
          # 上游原项目的仓库地址（格式: 原作者用户名/原仓库名）
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_branch: main
          upstream_sync_repo: EKKOLearnAI/ekko-studio


      - name: Check sync status
        if: failure()
        run: |
          echo "同步失败，可能是出现了代码冲突，请手动排查解决。"
          exit 1
